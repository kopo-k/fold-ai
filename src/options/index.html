<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fold-ai settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main id="app">
      <h1 id="title"></h1>
      <form id="settings-form">
        <fieldset>
          <label class="row">
            <input type="checkbox" id="autoFold" />
            <span id="label-autoFold"></span>
          </label>

          <label class="row">
            <span id="label-foldThreshold"></span>
            <input type="number" id="foldThreshold" min="1" max="500" step="1" />
          </label>

          <label class="row">
            <input type="checkbox" id="keepLastExpanded" />
            <span id="label-keepLastExpanded"></span>
          </label>

          <label class="row">
            <span id="label-shortcut"></span>
            <input type="text" id="shortcut" spellcheck="false" autocomplete="off" />
          </label>
        </fieldset>

        <fieldset>
          <legend id="label-perSite"></legend>
          <div id="per-site"></div>
        </fieldset>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
