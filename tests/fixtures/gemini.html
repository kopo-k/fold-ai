<!-- Gemini の DOM スナップショット（簡略版）。 -->
<div class="chat-container">
  <user-query>
    <div>ユーザーの質問</div>
  </user-query>

  <model-response data-response-complete="true">
    <message-content>
      <p>完了した Gemini の回答。折りたたみ対象。</p>
    </message-content>
  </model-response>

  <model-response>
    <message-content>
      <p>生成中の回答（data-response-complete 未設定）。触らない。</p>
    </message-content>
  </model-response>
</div>
